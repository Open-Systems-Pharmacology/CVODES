name: Build and pack

# Reusable workflow shared by build-pr.yml (PR validation) and
# build-and-publish.yml (default-branch pushes that publish to GitHub Packages).
# The only behavioural difference between the two is whether the resulting
# nupkg is pushed, controlled by the `publish` input.

on:
  workflow_call:
    inputs:
      app_version:
        description: "Full four-part version string, e.g. 6.0.0.42"
        type: string
        required: true
      publish:
        description: "Push the resulting nupkg to GitHub Packages"
        type: boolean
        default: false

jobs:
  build-native-nix:
    strategy:
      matrix:
        include:
          - os: ${{ vars.GHA_DEFAULT_RUNNER_MACOS }}
            rid: osx-arm64
            native_file: libsundials_cvodes.a
          - os: ${{ vars.GHA_DEFAULT_RUNNER_UBUNTU }}
            rid: linux-x64
            native_file: libsundials_cvodes.a

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Build native static lib
        run: |
          chmod ugo+x buildNix.sh
          ./buildNix.sh

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/${{ matrix.native_file }}

  build-windows-and-pack:
    runs-on: ${{ vars.GHA_DEFAULT_RUNNER_WINDOWS }}
    needs: build-native-nix

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Windows native static lib
        run: ./build_Windows.bat
        shell: cmd

      - name: Download linux-x64 native
        uses: actions/download-artifact@v7
        with:
          name: native-linux-x64
          path: runtimes/linux-x64/native

      - name: Download osx-arm64 native
        uses: actions/download-artifact@v7
        with:
          name: native-osx-arm64
          path: runtimes/osx-arm64/native

      - name: Pack
        run: nuget pack CVODES.nuspec -version ${{ inputs.app_version }}
        shell: cmd

      - name: Upload nupkg as artifact
        uses: actions/upload-artifact@v7
        with:
          name: CVODES.${{ inputs.app_version }}.nupkg
          path: ./CVODES.*.nupkg

      - name: Publish to GitHub registry
        if: ${{ inputs.publish }}
        shell: pwsh
        run: dotnet nuget push .\CVODES*.nupkg --source https://nuget.pkg.github.com/${{github.repository_owner}}/index.json --api-key ${{ secrets.GITHUB_TOKEN }}
